<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Solid Premium Gold Badge - matches project badge style -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#goldGrad)" />
  <rect x="5" y="5" width="118" height="118" rx="29" fill="none" stroke="#fef08a" stroke-width="2" stroke-opacity="0.8" />

  <!-- Crisp Obsidian Dark Emblem (Camera Aperture / Buildnex B) -->
  <g filter="url(#glow)">
    <!-- Camera Body -->
    <rect x="30" y="40" width="68" height="52" rx="12" fill="#1c1917" />
    <path d="M 48 40 L 53 32 L 75 32 L 80 40 Z" fill="#1c1917" />
    <!-- Flash indicator -->
    <circle cx="82" cy="49" r="4" fill="#fbbf24" />
    <!-- Golden Aperture Lens -->
    <circle cx="64" cy="66" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" />
    <circle cx="64" cy="66" r="13" fill="#1c1917" />
    <circle cx="64" cy="66" r="7" fill="#fbbf24" />
    <!-- Aperture highlight -->
    <circle cx="67" cy="63" r="2.5" fill="#ffffff" />
  </g>
</svg>